<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function textStats(txt){
            let words = txt.split(/[ ,]+/)
            let upperStart = 0;
            words.forEach(word => {
                if(word[0]==word[0].toUpperCase() && word[0]!=word[0].toLowerCase()){
                    upperStart++
                }
            });
            return `Słów: ${words.length}, z dużej litery: ${upperStart}`
        }
    </script>
</body>
</html>
