<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			body {
				height: 100vh;
				margin: 0;
				padding: 0;
                background: url(donbas.jpg) no-repeat;
                background-size: cover;
			}
		</style>
	</head>
	<body>
		<div
			style="
				width: 1000px;
				height: 1000px;
				position: relative;
				margin: 100px auto;
			"
		>
			<img
				id="moving"
				src="szachtar.svg"
				style="
					width: 100px;
					height: 100px;
					position: absolute;
					left: 450px;
					top: 900px;
				"
			/>
		</div>
		<script>
			let centrs = [
				{ x: 500, y: 750 },
				{ x: 250, y: 500 },
				{ x: 500, y: 250 },
				{ x: 750, y: 500 },
			];
			let startAngles = [0, 90, 180, 270];
			let radius = 250;
			let steps = 0;
			let currentIdx = 0;
			let angle = startAngles[currentIdx];
			let activeCenter = centrs[currentIdx];
			function tick() {
				let sinus = Math.sin(angle * (Math.PI / 180));
				let cosinus = Math.cos(angle * (Math.PI / 180));
				let dx = cosinus * radius;
				let dy = sinus * radius;
				document.getElementById("moving").style.left =
					`${activeCenter.x + dx - 50}px`;
				document.getElementById("moving").style.top =
					`${activeCenter.y + dy - 50}px`;
				angle++;
				steps++;
				if (steps == 180) {
					steps = 0;
					currentIdx++;
					if (currentIdx > 3) {
						currentIdx = 0;
					}
					angle = startAngles[currentIdx];
					activeCenter = centrs[currentIdx];
				}
			}
			setInterval(tick, 10);
		</script>
	</body>
</html>
