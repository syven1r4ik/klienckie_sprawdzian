<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<title>Document</title>

	<body>
		<script>
			function fiboDesc(n) {
				let fibbArray = [];
				for (let i = 0; i < n; i++) {
                    if(i==0){
                        fibbArray.unshift(0)
                    } else if(i==1 || i==2){
                        fibbArray.unshift(1)
                    } else{
                        fibbArray.unshift(fibbArray[0]+fibbArray[1])
                    }
                }
                return fibbArray
			}
		</script>
	</body>
</html>
